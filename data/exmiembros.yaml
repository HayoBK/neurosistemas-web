#   web / scholar / linkedin   Enlaces (opcionales).
#   formacion          Texto libre con estudios (solo si no hay 'hoy').
#   confianza          alta | media | sin-datos. Con 'sin-datos' la persona
#                      va a la franja "También pasaron por el laboratorio".
