# ============================================================
# FUENTES ORCID PARA LA SINCRONIZACIÓN AUTOMÁTICA
#
# El script scripts/orcid_sync.py recorre esta lista una vez al día
# (GitHub Action .github/workflows/orcid.yml), consulta la API pública
# de ORCID y escribe data/publicaciones_orcid.json.
#
# CÓMO AGREGAR A ALGUIEN
#   1. Pídele su identificador ORCID (o búscalo en https://orcid.org).
#      Tiene la forma 0000-0000-0000-0000.
#   2. Agrégalo abajo con su nombre.
#   3. Si además quieres que aparezca el botón ORCID en su ficha del
#      equipo, copia el mismo id en data/miembros.yaml.
#
# NOTA: solo se leen los registros PÚBLICOS de cada perfil ORCID.
#       Si un perfil está en privado, no aparecerá nada.
#
# 'apellidos' se usa para resaltar en negrita a los miembros del
# laboratorio dentro de la lista de autores.
# ============================================================

