name: Desplegar sitio Hugo en GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
      HUGO_ENVIRONMENT: production
    steps:
      - name: Instalar Hugo extended
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v6
      # El baseURL sale de config/_default/hugo.yaml (dominio propio), NO de
      # steps.pages.outputs.base_url: ese valor solo conoce el dominio propio
      # DESPUÉS del primer deploy con static/CNAME, así que usarlo compilaría
      # el sitio con el prefijo /neurosistemas-web/ y lo dejaría sin CSS.
      - name: Build con Hugo
        run: |
          hugo --gc --minify
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
