# ============================================================
# LABORATORIO DE NEUROSISTEMAS — Configuración principal de Hugo
# Sitio autocontenido (sin módulos Go, sin Tailwind, sin npm).
# Hugo extended 0.162.1
# ============================================================

# Dominio propio. Esta línea es la ÚNICA fuente de verdad del baseURL: el
# workflow de GitHub Actions ya no lo sobreescribe, así que el build local y el
# de producción son idénticos. El dominio se le declara a GitHub Pages con
# static/CNAME, que Hugo copia a public/ en cada build.
# `hugo server` ignora este valor y usa localhost:1313, como siempre.
baseURL: "https://www.neurosistemas.cl/"

title: "Laboratorio de Neurosistemas"
locale: "es-CL"
defaultContentLanguage: "es"
hasCJKLanguage: false

enableEmoji: true
enableRobotsTXT: true
summaryLength: 30
buildFuture: true

removePathAccents: true
disableAliases: false

pagination:
  pagerSize: 12

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github

imaging:
  resampleFilter: lanczos
  quality: 88
  anchor: smart

taxonomies:
  tag: tags
  categoria: categorias

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
